<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dental Clinic Check-In</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        #confirmation {
            display: none;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card">

    <!-- PIN SCREEN -->

    <div id="pinScreen">

        <h1>Receptionist Verification</h1>

        <p>
            Enter the receptionist PIN to continue.
        </p>

        <input
            id="pinInput"
            type="password"
            inputmode="numeric"
            placeholder="Enter PIN"
        >

        <button id="verifyButton">
            Verify
        </button>

        <p id="pinStatus"></p>

    </div>


    <!-- CONFIRMATION SCREEN -->

    <div id="confirmation">

        <h1>Patient Check-In</h1>

        <p>
            Confirm that this patient has arrived at the clinic.
        </p>

        <button id="checkInButton">
            Confirm Check-In
        </button>

        <p id="status"></p>

    </div>

</div>


<script>

    // Get token from URL

    const pathParts = window.location.pathname.split('/');

    const token =
        pathParts[1] === 'c'
            ? pathParts[2]
            : null;


    const pinInput =
        document.getElementById('pinInput');

    const verifyButton =
        document.getElementById('verifyButton');

    const pinStatus =
        document.getElementById('pinStatus');

    const pinScreen =
        document.getElementById('pinScreen');

    const confirmation =
        document.getElementById('confirmation');

    const checkInButton =
        document.getElementById('checkInButton');

    const status =
        document.getElementById('status');


    // No token

    if (!token) {

        pinScreen.innerHTML =
            '<h1>Invalid Check-In</h1>' +
            '<p>No valid check-in token was found.</p>';

    }


    // Verify receptionist PIN

    verifyButton.addEventListener('click', () => {

        const pin = pinInput.value;


        if (pin === '1234') {

            pinScreen.style.display = 'none';

            confirmation.style.display = 'block';

        } else {

            pinStatus.textContent =
                'Incorrect PIN.';

            pinInput.value = '';

        }

    });


    // Check in patient

    checkInButton.addEventListener('click', async () => {

        checkInButton.disabled = true;

        checkInButton.textContent =
            'Checking in...';


        try {

            const response = await fetch(
                'https://laborer-recess-zippy.ngrok-free.dev/webhook-test/patient-checkin',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        check_in_token: token
                    })
                }
            );


            const data =
                await response.json();


            if (data.success) {

                confirmation.innerHTML =
                    '<h1>✓ Check-In Successful</h1>' +
                    '<p>The patient has been checked in.</p>';

            } else {

                checkInButton.disabled = false;

                checkInButton.textContent =
                    'Confirm Check-In';

                status.textContent =
                    data.message ||
                    'Check-in failed.';

            }


        } catch (error) {

            console.error(error);

            checkInButton.disabled = false;

            checkInButton.textContent =
                'Confirm Check-In';

            status.textContent =
                'Unable to connect to the clinic system.';

        }

    });

</script>

</body>

</html>

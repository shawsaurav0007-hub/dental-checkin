<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dental Clinic Check-In</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Dental Clinic Check-In</h1>

    <p id="message">
        Confirm that you are the clinic receptionist before checking in this patient.
    </p>

    <button id="checkInButton">
        Confirm Check-In
    </button>

    <p id="status"></p>

</div>

<script>

    // Get token from URL
    const pathParts = window.location.pathname.split('/');

    const token =
        pathParts[1] === 'c'
            ? pathParts[2]
            : null;

    const button = document.getElementById('checkInButton');
    const status = document.getElementById('status');
    const message = document.getElementById('message');


    // No token
    if (!token) {

        button.style.display = 'none';

        message.textContent =
            'No valid check-in token found.';

    }


    // Button clicked
    button.addEventListener('click', async () => {

        if (!token) return;

        button.disabled = true;

        button.textContent = 'Checking in...';

        status.textContent = '';


        try {

            const response = await fetch(
                'https://laborer-recess-zippy.ngrok-free.dev/webhook-test/patient-checkin',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        check_in_token: token
                    })
                }
            );


            const data = await response.json();


            console.log('n8n response:', data);


            if (data.success) {

                message.textContent =
                    'Patient successfully checked in.';

                button.style.display = 'none';

                status.textContent =
                    '✓ Check-in successful!';

            } else {

                button.disabled = false;

                button.textContent =
                    'Confirm Check-In';

                status.textContent =
                    data.message || 'Check-in failed.';

            }

        } catch (error) {

            console.error(error);

            button.disabled = false;

            button.textContent =
                'Confirm Check-In';

            status.textContent =
                'Unable to connect to the clinic system.';

        }

    });

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Check-In</title>
</head>

<body>

    <h1>Dental Clinic Check-In</h1>

    <p id="status">Reading QR code...</p>

    <script>
        const pathParts = window.location.pathname.split('/');

        const token = pathParts[1] === 'c'
            ? pathParts[2]
            : null;

        const status = document.getElementById('status');

        if (!token) {

            status.textContent = 'No check-in token found.';

        } else {

            status.textContent = 'Checking in...';

            fetch('https://laborer-recess-zippy.ngrok-free.dev/webhook-test/patient-checkin', {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    check_in_token: token
                })
            })

            .then(response => response.json())

            .then(data => {

                console.log(data);

                if (data.success) {
                    status.textContent = '✓ Check-in successful!';
                } else {
                    status.textContent = 'Check-in failed.';
                }

            })

            .catch(error => {

                console.error(error);

                status.textContent =
                    'Unable to connect to clinic system.';

            });
        }
    </script>

</body>
</html>
